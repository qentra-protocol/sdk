name: Native SDK package proof
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated core, SDK and fresh packed consumer
        run: python3 tools/package-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-package-proof
          path: |
            package-proof.json
            *.tgz
            package-lock.json
            .package-proof/core/package-lock.json
          include-hidden-files: true
